<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard PaketExpress</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4">
    <div class="max-w-xl mx-auto">
        <h1 class="text-2xl font-bold mb-6">📦 PaketExpress</h1>
        <div id="list" class="space-y-3">
            <p>Memuat data...</p>
        </div>
    </div>

    <script>
        const API_URL = "/api/packages";

        async function load() {
            try {
                const res = await axios.get(API_URL);
                const list = document.getElementById('list');
                const dataPaket = res.data.data || [];
                
                if (dataPaket.length === 0) {
                    list.innerHTML = '<p>Belum ada paket.</p>';
                    return;
                }

                list.innerHTML = dataPaket.map(p => `
                    <div class="bg-white p-4 rounded shadow">
                        <p class="font-bold">${p.resi}</p>
                        <p class="text-sm text-gray-600">${p.status}</p>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('list').innerHTML = '<p class="text-red-500">Gagal memuat data.</p>';
            }
        }
        load();
    </script>
</body>
</html>
